[package]
name = "ff-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "GPU compositing pipeline for real-time preview (wgpu-based)"
license.workspace = true
readme = "README.md"
repository.workspace = true
keywords = ["video", "gpu", "wgpu", "compositing", "rendering"]
categories = ["multimedia::video", "rendering"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
wgpu    = ["dep:wgpu", "dep:futures"]
# GPU-resident preview: hand the composited texture to the sink without a
# GPU-to-CPU readback. Implies wgpu and enables ff-preview's matching path.
display = ["wgpu", "ff-preview/display"]

[dependencies]
ff-preview = { workspace = true }
ff-format  = { workspace = true }
log        = { workspace = true }
thiserror  = { workspace = true }
image      = { workspace = true }

[dependencies.wgpu]
version  = "30.0.0"
optional = true

# Block-on executor for the synchronous `RenderContext::init_blocking` (wgpu-gated),
# so callers (e.g. the preview runner thread) stay executor-agnostic.
[dependencies.futures]
workspace = true
optional  = true

[dev-dependencies]
futures = { workspace = true }

[[test]]
name = "gpu_nodes"
required-features = ["wgpu"]

[lints]
workspace = true
