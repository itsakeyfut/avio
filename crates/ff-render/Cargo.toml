[package]
name = "ff-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "GPU compositing pipeline for real-time preview (wgpu-based)"
license.workspace = true
readme = "README.md"
repository.workspace = true
keywords = ["video", "gpu", "wgpu", "compositing", "rendering"]
categories = ["multimedia::video", "rendering"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
wgpu    = ["dep:wgpu"]

[dependencies]
ff-preview = { workspace = true }
ff-format  = { workspace = true }
log        = { workspace = true }
thiserror  = { workspace = true }

[dependencies.wgpu]
version  = "30.0.0"
optional = true

[dev-dependencies]
futures = { workspace = true }

[[test]]
name = "gpu_nodes"
required-features = ["wgpu"]

[lints]
workspace = true
