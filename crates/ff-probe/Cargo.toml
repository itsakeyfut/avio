[package]
name = "ff-probe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Read-only media file metadata extraction over FFmpeg"
license.workspace = true
readme = "README.md"
repository.workspace = true
keywords = ["video", "audio", "ffmpeg", "media", "probe"]
categories = ["multimedia::video", "multimedia::audio", "multimedia::images", "api-bindings"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
ff-format = { workspace = true }
ff-sys = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
# Test-only: the decoder is the oracle a claim about decodability is checked against,
# rather than a fixed expected answer (#1850). Not a cycle: ff-decode does not depend
# on ff-probe, and the edge is dev-only.
ff-decode = { workspace = true }

[[bench]]
name = "probe_bench"
harness = false

[lints]
workspace = true
