[package]
name = "avio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Video and audio editing engine: build a Timeline of clips, edit with undo/redo, and render to a file"
license.workspace = true
readme = "README.md"
repository.workspace = true
keywords = ["video", "audio", "ffmpeg", "codec", "async"]
categories = ["multimedia::video", "multimedia::audio", "multimedia::encoding", "api-bindings", "asynchronous"]

[features]
# avio is the editing engine: the model + probe + analysis are always present
# (their crates are non-optional), so the only opt-in capabilities are these.
default = ["hwaccel"]
hwaccel = ["ff-encode/hwaccel"] # hardware-accelerated export
gpl     = ["ff-encode/gpl"]     # GPL-only codecs (x264 / x265)
preview = ["dep:ff-preview", "ff-preview/timeline"] # real-time TimelinePlayer / Scene
serde   = ["dep:serde", "ff-filter/serde", "ff-format/serde"] # (de)serialize the model

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Core engine: avio *is* the editing engine, so the crates its model
# (Timeline / Clip / Editor / derive / render) needs are non-optional.
ff-format = { workspace = true }
ff-common = { workspace = true }
ff-probe    = { workspace = true }
ff-decode   = { workspace = true }
ff-encode   = { workspace = true }
ff-filter   = { workspace = true }
ff-pipeline = { workspace = true }
ff-analysis = { workspace = true }
thiserror   = { workspace = true }
log         = { workspace = true }
# Opt-in: real-time preview and model (de)serialization.
ff-preview  = { workspace = true, optional = true }
serde       = { version = "1.0.228", features = ["derive"], optional = true }

[[test]]
name = "serde_persistence"
required-features = ["serde"]

# The editing model is unconditional, so its tests build by default (no feature gate).
[[test]]
name = "timeline_tests"

[[test]]
name = "composition_framerate"

[[test]]
name = "timeline_preview_tests"
required-features = ["preview"]

# Engine demo — builds by default now that the model is unconditional.
[[example]]
name = "timeline_render"
path = "examples/transcode/timeline_render.rs"

[dev-dependencies]
# Used directly by the relocated editing-model integration tests
# (tests/timeline_tests.rs, tests/composition_framerate.rs, tests/fixtures/).
ff-format = { path = "../ff-format" }
ff-probe  = { path = "../ff-probe" }
ff-decode = { path = "../ff-decode" }
ff-encode = { path = "../ff-encode" }
ff-filter = { path = "../ff-filter" }
serde_json = "1.0.149"

[lints]
workspace = true
