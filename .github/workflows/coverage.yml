name: Coverage

# Informational code coverage. This workflow is deliberately SEPARATE from ci.yml
# and is NOT part of ci.yml's required `ci` aggregation gate, so a coverage or
# Codecov hiccup can never block a merge (see codecov.yml for the policy).
#
# It runs on macOS because the Linux CI FFmpeg is built with no individual filters
# (.github/actions/setup-ffmpeg), so filter/integration tests skip there and would
# under-report coverage. macOS uses Homebrew's full FFmpeg, so those tests execute.

on:
  # PR delta is the actionable signal (Codecov comments the change before merge).
  pull_request:
    branches: [main]
  # Weekly main-branch snapshot for the coverage trend. A solo, low-volume repo
  # does not need a heavy macOS run on every merge, so push[main] is intentionally
  # omitted in favour of this periodic run (Codecov's base refreshes weekly).
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  # On-demand run.
  workflow_dispatch:

# Cancel superseded runs on the same PR; never cancel scheduled/manual runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  coverage:
    name: Coverage (macOS, full FFmpeg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # Full FFmpeg (all filters), matching the macOS test leg in ci.yml, so
      # filter/integration tests actually run under instrumentation. Pinned to the
      # same formula for the same reason (#1728); see the note in ci.yml.
      - name: Install FFmpeg (macOS)
        id: ffmpeg
        run: |
          # `brew update` first: the pin resolves only if the runner's formula index
          # knows `ffmpeg@8`, and `macos-latest` currently rotates between two images
          # whose Homebrew snapshots disagree about that. Image 20260728 has it and
          # 20260831 does not, so without this the same commit passes or fails depending
          # on which one it lands on.
          brew update
          # `ffmpeg@8` depends on `openssl@4` (formulae.brew.sh/api/formula/ffmpeg@8.json).
          # `openssl@4` is not keg-only and its `link_overwrite` covers `bin/openssl`,
          # `lib/libcrypto*`, `lib/libssl*` and the pkgconfig files, which are the ones
          # the image's `openssl@3` already owns. Installing it therefore has to lock the
          # `openssl@3` keg, and doing that from inside the `ffmpeg@8` transaction, which
          # is already holding a dozen dependency locks, deadlocks against itself:
          #
          #   ffmpeg@8: A `brew install ffmpeg@8 pkg-config` process has already locked
          #   /opt/homebrew/Cellar/openssl@3
          #
          # Unlinking first is one invocation holding one lock, and leaves `openssl@4`
          # nothing to take over. A retry does not help; the lock is not transient (#1944).
          # `|| true` because a later image may not carry `openssl@3`, which is the state
          # this is reaching for rather than a failure.
          brew unlink openssl@3 || true
          brew install ffmpeg@8 pkg-config
          echo "prefix=$(brew --prefix ffmpeg@8)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      # Same coverage surface as the test job (`--all --all-features`).
      - name: Collect coverage
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info
        env:
          # Scoped to this step, not $GITHUB_ENV: only ff-sys/build.rs wants it, and
          # taiki-e/install-action above must keep seeing the real Homebrew root.
          HOMEBREW_PREFIX: ${{ steps.ffmpeg.outputs.prefix }}

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          # Informational only: a Codecov outage must not fail this job.
          fail_ci_if_error: false
