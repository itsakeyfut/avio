name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same PR/branch; never cancel pushes to main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # --------------------------------------------------------------------------
  # Format check (no FFmpeg needed)
  # --------------------------------------------------------------------------
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # --------------------------------------------------------------------------
  # Clippy on the full feature set (FFmpeg headers required for bindgen)
  # --------------------------------------------------------------------------
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-ffmpeg
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all --all-features -- -D warnings

  # --------------------------------------------------------------------------
  # Tests on Linux + macOS (full feature set)
  # --------------------------------------------------------------------------
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup FFmpeg (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-ffmpeg

      # Pinned (#1728). Homebrew's `ffmpeg` moved to 9.x, which drops the deprecated
      # AVCodec arrays ff-encode reads, and broke every PR overnight. The README
      # supports 7.x and 8.x, so Linux stays on the pinned 7.1 source build and macOS
      # covers 8.x. Pinned to the *major*: ffmpeg@8 tracks 8.x rather than an exact
      # version like the Linux leg's 7.1, because FFmpeg does not remove API within a
      # major and this leg should still catch real 8.x breakage.
      #
      # ffmpeg@8 is keg-only, so ff-sys/build.rs has to be pointed at its keg:
      # configure_macos() calls try_homebrew() *before* the pkg-config fallback, so
      # PKG_CONFIG_PATH alone would let whatever `ffmpeg` the image has linked win over
      # the pin. The prefix goes to a step output rather than $GITHUB_ENV so it reaches
      # only the cargo step -- HOMEBREW_PREFIX otherwise names the Homebrew root, and
      # the other steps (rust-cache, install-action) must keep seeing the real one.
      - name: Install FFmpeg (macOS)
        id: ffmpeg
        if: runner.os == 'macOS'
        run: |
          # `brew update` first: the pin resolves only if the runner's formula index
          # knows `ffmpeg@8`, and `macos-latest` currently rotates between two images
          # whose Homebrew snapshots disagree about that. Image 20260728 has it and
          # 20260831 does not, so without this the same commit passes or fails depending
          # on which one it lands on.
          brew update
          brew install ffmpeg@8 pkg-config
          echo "prefix=$(brew --prefix ffmpeg@8)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Empty on Linux, where the step above is skipped. Harmless: HOMEBREW_PREFIX is
      # only read by configure_macos(), which never runs there.
      - run: cargo test --all --all-features
        env:
          HOMEBREW_PREFIX: ${{ steps.ffmpeg.outputs.prefix }}

  # --------------------------------------------------------------------------
  # Windows (MSVC) compile check. FFmpeg is deliberately NOT installed here:
  # building it via vcpkg takes ~20 minutes and dominates CI time. DOCS_RS=1
  # makes ff-sys/build.rs skip bindgen/vcpkg and use the checked-in stub
  # bindings, so this stays fast (a Rust-only compile) while still verifying
  # the Windows-specific (cfg(windows)) code paths on the MSVC target.
  # Running the real FFmpeg-linked test suite on Windows is left to local
  # development, which already uses vcpkg per CONTRIBUTING.
  # --------------------------------------------------------------------------
  check-windows:
    name: Check (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compile the workspace with DOCS_RS=1 (no FFmpeg needed)
        run: cargo check --workspace
        env:
          DOCS_RS: "1"

  # --------------------------------------------------------------------------
  # MSRV: verify the crate still compiles on the declared minimum (Cargo.toml
  # `rust-version`). Default features only — this is the core promise; the
  # optional wgpu/gpl features may depend on crates with a newer MSRV. `check`
  # only: clippy lints are version-specific and belong on the stable job.
  # --------------------------------------------------------------------------
  msrv:
    name: MSRV (1.93.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-ffmpeg
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  # --------------------------------------------------------------------------
  # Feature isolation: verify every crate feature compiles on its own (and the
  # no-default-features baseline). Replaces the ad-hoc "no tokio feature" job.
  # --------------------------------------------------------------------------
  features:
    name: Feature powerset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-ffmpeg
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - uses: Swatinem/rust-cache@v2
      - run: cargo hack check --workspace --each-feature --no-dev-deps --keep-going

  # --------------------------------------------------------------------------
  # docs.rs stubs: verify docsrs_stubs.rs compiles for all workspace crates.
  # No FFmpeg installation required — DOCS_RS=1 causes ff-sys/build.rs to
  # skip the real bindgen step and use the stub file instead.
  # This job catches missing symbols in docsrs_stubs.rs before publishing.
  # --------------------------------------------------------------------------
  docsrs-stubs:
    name: docs.rs stubs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build workspace with DOCS_RS=1 (no FFmpeg needed)
        # Exclude the publish=false example harness: its src/bin/* link FFmpeg,
        # which the DOCS_RS stub build does not provide. It is never published to
        # docs.rs, and the test jobs compile its binaries with real FFmpeg.
        run: cargo build --workspace --exclude avio-examples
        env:
          DOCS_RS: "1"

  # --------------------------------------------------------------------------
  # Docs — `cargo doc` with `-D warnings` catches doc warnings and broken
  # intra-doc links before they reach main. DOCS_RS=1 makes ff-sys/build.rs skip
  # bindgen and use the checked-in stub bindings, so docs build with no FFmpeg —
  # the same path docs.rs uses, so this job also guards the docs.rs build. The
  # docsrs-stubs job keeps the stubs complete, so intra-doc-link resolution here
  # matches a real build.
  # --------------------------------------------------------------------------
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --all-features --no-deps
        env:
          DOCS_RS: "1"
          RUSTDOCFLAGS: -D warnings

  # --------------------------------------------------------------------------
  # Publishing readiness: verify every library crate has complete publish
  # metadata and passes `cargo publish --dry-run`, and that non-library members
  # stay publish=false. No FFmpeg: the script uses --no-verify (matching
  # release-plz's publish_no_verify), so it skips the compile step the test and
  # features jobs already cover.
  # --------------------------------------------------------------------------
  publish-ready:
    name: Publishing readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python3 .github/scripts/check-publish-readiness.py

  # --------------------------------------------------------------------------
  # Aggregation gate: the single required check for branch protection. Passes
  # only if every job above succeeded. Referencing just this check keeps branch
  # protection stable as jobs are added or renamed.
  # --------------------------------------------------------------------------
  ci:
    if: always()
    needs:
      - fmt
      - clippy
      - test
      - check-windows
      - msrv
      - features
      - docsrs-stubs
      - docs
      - publish-ready
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any dependency failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: Success
        run: exit 0
