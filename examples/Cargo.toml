# User-perspective, self-verifying end-to-end scripts that exercise avio's
# video-editing surface through the public `avio` facade only. This crate depends
# on avio the way a downstream consumer would (a dependency line + explicit
# features), so a failing script isolates the problem to avio (no egui, no demo).
#
# It is intentionally NOT published and does NOT inherit the workspace lints: a
# real consumer does not adopt avio's internal `unwrap_used`/`pedantic` policy.
[package]
name = "avio-examples"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
# Consumer-POV smoke test of the avio editing engine. Enables the opt-in
# capabilities avio-editor-demo uses (preview + serde).
avio = { path = "../crates/avio", features = ["preview", "serde"] }
# The scripts reach for a few ff-* primitives directly (probe a source, synthesize
# fixture frames) the way a consumer would, since avio no longer re-exports them (ADR-0004).
ff-decode = { path = "../crates/ff-decode" }
ff-encode = { path = "../crates/ff-encode" }
ff-common = { path = "../crates/ff-common" }
tempfile = "3"
